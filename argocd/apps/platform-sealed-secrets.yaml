apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-sealed-secrets
  namespace: argocd
  annotations:
    # 다른 무엇보다 먼저. 컨트롤러가 없으면 SealedSecret 이 Secret 으로 안 풀림
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default

  # 외부 차트 + 우리 레포의 values 를 같이 쓰는 multi-source 구성
  # $values 가 두 번째 소스를 가리킴
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      # 버전 고정. stable 같은 움직이는 태그를 쓰면 모르는 사이에 올라감
      # 차트 2.20.0 = appVersion 0.40.0. 로컬 kubeseal CLI 버전과 맞춤
      targetRevision: "2.20.0"
      helm:
        # 차트의 fullname 규칙과 무관하게 리소스 이름을 sealed-secrets 로 맞춤
        releaseName: sealed-secrets
        valueFiles:
          - $values/platform/sealed-secrets/values.yaml
    - repoURL: https://github.com/ldhbenecia/ldh-infra-lab-manifests.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
