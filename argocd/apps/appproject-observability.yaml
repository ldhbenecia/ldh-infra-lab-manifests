# 관측 스택 (ldh-infra-lab-lgtm 레포). monitoring ns 밖으로는 배포 불가
# 출처 저장소·클러스터 리소스는 실제로 쓰게 될 때 하나씩 추가한다 (최소 권한)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: 관측 스택 — LGTM + Alloy
  sourceRepos:
    - https://github.com/ldhbenecia/ldh-infra-lab-lgtm.git
    - https://grafana.github.io/helm-charts      # mimir-distributed (7.1)
    - https://grafana-community.github.io/helm-charts   # grafana (7.1)
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace          # CreateNamespace=true
    # Alloy(7.1): 모든 ns 의 ServiceMonitor·Service·Pod 를 읽어야 수집 대상을 찾는다
    # 무엇을 읽을 수 있는지는 lgtm alloy/values.yaml 의 rbac 에서 최소로 제한
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
