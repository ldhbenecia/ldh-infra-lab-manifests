apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: msa-secrets
  namespace: argocd
spec:
  project: msa

  # user-service 와 api-gateway 가 공유하는 JWT 서명 키
  source:
    repoURL: https://github.com/ldhbenecia/ldh-infra-lab-manifests.git
    targetRevision: main
    path: apps/msa/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: msa

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
