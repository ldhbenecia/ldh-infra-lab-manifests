# 수집기. Alloy 차트 (grafana/helm-charts) + lgtm values
# 실무에서 앱 클러스터에 배포되는 쪽 (백엔드는 모니터링 클러스터)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-alloy
  namespace: argocd
  annotations:
    # 받는 쪽(mimir 1)·보는 쪽(grafana 2) 다음. 보내는 쪽은 마지막
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: observability
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/alloy/values.yaml
    - repoURL: https://github.com/ldhbenecia/ldh-infra-lab-lgtm.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
