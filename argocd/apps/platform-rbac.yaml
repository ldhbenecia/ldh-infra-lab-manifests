apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ldhbenecia/ldh-infra-lab-manifests.git
    targetRevision: main
    path: platform/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
