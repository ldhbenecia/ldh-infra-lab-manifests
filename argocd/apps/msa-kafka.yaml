apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: msa-kafka
  namespace: argocd
  annotations:
    # msa ns 를 만드는 쪽이라 msa-secrets(wave 0)보다 먼저
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: msa

  source:
    repoURL: https://github.com/ldhbenecia/ldh-infra-lab-manifests.git
    targetRevision: main
    path: apps/msa/kafka

  destination:
    server: https://kubernetes.default.svc
    namespace: msa

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
