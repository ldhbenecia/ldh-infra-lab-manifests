apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: morris-secrets
  namespace: argocd
  annotations:
    # MySQL·게임서버보다 먼저. Secret 이 없으면 둘 다 CrashLoopBackOff
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: morris

  source:
    repoURL: https://github.com/ldhbenecia/ldh-infra-lab-manifests.git
    targetRevision: main
    path: apps/morris/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: morris

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
