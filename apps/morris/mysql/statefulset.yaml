# 게임 서버 전용 MySQL. 차트를 쓰지 않고 직접 쓴 이유는 워크로드 종류가 다름
# http-service 차트는 Deployment 전제이고, 여기는 파드와 디스크가 1:1로 묶여야 함
#
# 자격증명은 Git에 두지 않음. morris-mysql-secret 을 클러스터에 직접 만들어 둬야 뜸
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: morris-mysql
  labels:
    app: morris-mysql
spec:
  serviceName: morris-mysql
  replicas: 1
  selector:
    matchLabels:
      app: morris-mysql
  template:
    metadata:
      labels:
        app: morris-mysql
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: mysql
        image: mysql:8.4
        args:
        # 기본값(400MB+)이면 노드 메모리를 혼자 먹음. 실습 트래픽에는 192M로 충분
        - --innodb-buffer-pool-size=192M
        - --performance-schema=OFF
        - --max-connections=50
        ports:
        - name: mysql
          containerPort: 3306
        envFrom:
        - secretRef:
            name: morris-mysql-secret
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            memory: "1Gi"
        # 포트가 열려도 초기화 스크립트가 끝나기 전에는 접속이 거부됨
        # ping 이 통해야 비로소 트래픽을 받을 수 있음
        readinessProbe:
          exec:
            command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\""]
          initialDelaySeconds: 15
          periodSeconds: 10
        # 외부 의존성이 없으므로 liveness 를 걸어도 재시작 루프 위험이 없음
        livenessProbe:
          exec:
            command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\""]
          initialDelaySeconds: 60
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
  # Deployment 와 달리 StatefulSet 은 PVC 를 파드마다 자기가 만듦
  # 파드가 지워져도 PVC 는 남아 같은 디스크로 되돌아옴
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
