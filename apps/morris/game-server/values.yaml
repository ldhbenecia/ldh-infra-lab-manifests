# 나인멘스모리스 게임 서버. 차트는 msa 와 같은 charts/http-service 를 씀
# profiles/spring.yaml 을 먼저 깔고 여기서 덮어씀

# 판 상태는 Redis, 방 이벤트는 Redis pub/sub 으로 파드 사이에 전달됨. 2 이상도 가능
# 단 Redis·MySQL 이 단일 파드라 그쪽이 재시작하면 앱 파드 수와 무관하게 전체가 빠짐
replicaCount: 1
image:
  repository: ghcr.io/ldhbenecia/nine-mens-morris
  # CI 가 커밋 SHA 로 덮어씀. latest 를 쓰면 매니페스트가 안 바뀌어 ArgoCD 가 배포를 감지하지 못함
  tag: "sha-63edec2"
  pullPolicy: IfNotPresent
service:
  port: 8080
  targetPort: 8080
config:
  # 헤드리스 서비스 이름으로 접속. 같은 네임스페이스라 FQDN 불필요
  SPRING_DATASOURCE_URL: "jdbc:mysql://morris-mysql:3306/morris?connectionTimeZone=UTC&characterEncoding=UTF-8"
  SPRING_DATASOURCE_USERNAME: "morris"
  # spring.data.redis.host 로 바인딩됨. 포트는 기본값 6379
  SPRING_DATA_REDIS_HOST: "morris-redis"
  # 메트릭 태그. 나중에 EKS 와 같은 Prometheus 를 보게 되면 이걸로 가름
  ENVIRONMENT: "k8s-local"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,https://ldhbenecia.github.io"
  DOMAIN: "http://localhost:5173"
# JWT 서명키·카카오 자격증명·DB 비밀번호. apps/morris/secrets 의 SealedSecret 이 풀어 만든 Secret 을 이름으로 참조
existingSecret: morris-game-server-secret
resources:
  requests:
    cpu: "300m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
probes:
  # Flyway 마이그레이션 + MySQL 기동 대기가 겹쳐 msa 서비스보다 오래 걸림
  readinessInitialDelay: 30
  livenessInitialDelay: 90
# 종료할 때 정산 트랜잭션(30s)과 스케줄러 종료 대기(20s)를 마쳐야 함
# 45s(차트 기본값)면 중간에 SIGKILL 이 들어옴
terminationGracePeriodSeconds: 70
# 부하 기준을 재기 전까지 끔. 기준 없이 켜면 늘어난 파드가 MySQL 커넥션을 먼저 바닥냄
autoscaling:
  enabled: false
serviceMonitor:
  enabled: true
ingress:
  enabled: true
  host: morris.lab.local
  # /actuator 는 넣지 않음. 프로브와 스크레이프는 컨테이너 포트로 직접 들어옴
  paths:
    - path: /api
    - path: /ws
  annotations:
    # WebSocket 은 한 연결을 길게 유지함. 기본 60s 면 판 도중에 끊김
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
