# msa 의 외부 입구는 api-gateway 하나
# 예전엔 user/order/product 로 바로 붙는 인그레스가 있어서 gateway 의 JWT 검사(AuthorizationHeaderFilter)를 건너뛰었음
# 경로는 gateway 가 나눔: /user-service/** /order-service/** /product-service/** (GatewayConfig.java)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: msa.lab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
