image:
  repository: ghcr.io/ldhbenecia/user-service
  tag: "f17eeda"
  pullPolicy: IfNotPresent
service:
  port: 8081
  targetPort: 8081
config:
  DB_URL: "jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1"
  KAFKA_BROKERS: "kafka-service:9092"
# TOKEN_SECRET 을 넣음 (k8s 프로파일이 기본값 없이 요구)
# api-gateway 가 같은 키로 검증하므로 둘이 같은 Secret 을 봄
existingSecret: msa-jwt-secret
resources:
  requests:
    cpu: "400m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 65
serviceMonitor:
  enabled: true
serviceAccountName: msa-service-account
