image:
  repository: ghcr.io/ldhbenecia/order-service
  tag: "sha-d8a149f"
  pullPolicy: IfNotPresent
service:
  port: 8082
  targetPort: 8082
config:
  DB_URL: "jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1"
  KAFKA_BROKERS: "kafka-service:9092"
resources:
  requests:
    cpu: "400m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 65
serviceMonitor:
  enabled: true
serviceAccountName: msa-service-account
