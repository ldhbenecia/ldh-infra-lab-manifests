image:
  repository: ghcr.io/ldhbenecia/api-gateway
  tag: "sha-aa71ef5"
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 8000
config:
  SERVER_PORT: "8000"
  GATEWAY_DISCOVERY_ENABLED: "true"
  GATEWAY_DISCOVERY_LOWERCASE: "true"
  KAFKA_BROKERS: "kafka-service:9092"
# TOKEN_SECRET 을 넣음 (k8s 프로파일이 기본값 없이 요구)
# user-service 가 서명한 토큰을 같은 키로 검증하므로 둘이 같은 Secret 을 봄
existingSecret: msa-jwt-secret
resources:
  requests:
    cpu: "300m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
# gateway는 부팅이 느리므로 여유를 더 줌
probes:
  enabled: true
  readinessInitialDelay: 30
  livenessInitialDelay: 120
serviceMonitor:
  enabled: true
serviceAccountName: msa-service-account
replicaCount: 2
