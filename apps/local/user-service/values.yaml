image:
  repository: msa/user-service
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  port: 8081
  targetPort: 8081

config:
  DB_URL: "jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1"
  KAFKA_BROKERS: "kafka-service:9092"

resources:
  requests:
    cpu: "400m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 65

serviceMonitor:
  enabled: true

serviceAccountName: msa-service-account
