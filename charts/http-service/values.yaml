replicaCount: 1
image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent
service:
  port: 8080
  targetPort: 8080
config: {}
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    memory: "256Mi"
probes:
  enabled: true
  readinessPath: /health
  livenessPath: /health
  readinessInitialDelay: 5
  livenessInitialDelay: 15
terminationGracePeriodSeconds: 45
preStopSleep: 5
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 65
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  releaseLabel: monitoring
serviceAccountName: ""
