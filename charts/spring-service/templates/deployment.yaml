apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if .Values.config }}
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-config
        {{- end }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.springProfile | quote }}
        {{- if .Values.probes.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readinessPath }}
            port: http
          initialDelaySeconds: {{ .Values.probes.readinessInitialDelay }}
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.livenessPath }}
            port: http
          initialDelaySeconds: {{ .Values.probes.livenessInitialDelay }}
          periodSeconds: 10
        {{- end }}
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep {{ .Values.preStopSleep }}"]
