# MSA 서비스들이 공유하는 ServiceAccount와 권한
#
# 용도: Spring Cloud Gateway의 쿠버네티스 서비스 디스커버리
#   - services  : 어떤 서비스가 존재하는가
#   - endpoints : 그 서비스 뒤에 어떤 Pod IP가 있는가
#   - pods      : Pod 상태 확인
#
# 앱 차트가 아닌 platform/에 두는 이유:
#   여러 릴리스가 공유하는 리소스이므로 소유자가 하나여야 한다.
#   차트에 두면 릴리스마다 같은 이름을 만들려 해서 충돌한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: msa-service-account
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: msa-service-reader
  namespace: default
rules:
- apiGroups: [""]
  resources: ["services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: msa-service-reader-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: msa-service-account
  namespace: default
roleRef:
  kind: Role
  name: msa-service-reader
  apiGroup: rbac.authorization.k8s.io
